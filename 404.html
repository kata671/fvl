<style>

  --bg:#08061a;--panel:rgba(34,24,66,.55);--border:rgba(168,140,255,.15);--border2:rgba(168,140,255,.32);

body{
  background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;

    radial-gradient(ellipse 75% 48% at 12% -8%,rgba(143,107,255,.16),transparent 52%),

<body>
<div class="wrap">
  <div class="art"><canvas id="c404" width="140" height="140"></canvas></div>
  <div class="code">BŁĄD 404 · WĘZEŁ POZA UKŁADEM</div>
  <h1>Tej strony nie ma w wzorze</h1>
  <p>Węzeł, którego szukasz, mógł zostać przesunięty albo nigdy nie istniał na tej płycie.
     Sprawdź adres albo wróć na stronę główną.</p>

  </div>
</div>
<script>
(function(){
  const canvas=document.getElementById("c404");if(!canvas)return;
  const ctx=canvas.getContext("2d");const N=140;canvas.width=N;canvas.height=N;
  const img=ctx.createImageData(N,N);const cx=N/2,cy=N/2,R=N/2;
  const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0;
  function smoothstep(x){return x*x*(3-2*x)}
  function draw(){
    const k1=3.1+Math.sin(t*0.17)*1.5,k2=2.2+Math.cos(t*0.13)*1.7,phase=t*0.55;
    const angCounter=2+t*0.045,n1=Math.floor(angCounter),n2=n1+1,blend=smoothstep(angCounter-n1);
    for(let y=0;y<N;y++){const dy=y-cy;
      for(let x=0;x<N;x++){const dx=x-cx,dist=Math.sqrt(dx*dx+dy*dy),i=(y*N+x)*4;
        if(dist>R-1){img.data[i+3]=0;continue}
        const nx=dx/R,ny=dy/R,r=Math.sqrt(nx*nx+ny*ny),theta=Math.atan2(ny,nx);
        const angPart=Math.cos(n1*theta+t*0.35)*(1-blend)+Math.cos(n2*theta+t*0.35)*blend;
        const angPartB=Math.cos(n1*(theta+1.05)-t*0.22)*(1-blend)+Math.cos(n2*(theta+1.05)-t*0.22)*blend;
        const v=Math.sin(k1*Math.PI*r+phase)*angPart
              +0.5*Math.cos(k2*Math.PI*r-phase*0.6)*angPartB
              +0.35*Math.sin((k1*0.5+2.0)*Math.PI*r+phase*0.4);
        const glow=Math.max(0,1-Math.abs(v)*1.9),edge=Math.max(0,1-dist/R*dist/R),g=glow*edge;
        img.data[i]=16+g*214;img.data[i+1]=12+g*182;img.data[i+2]=34+g*232;
        img.data[i+3]=Math.min(255,26*edge+g*235);
      }}
    ctx.putImageData(img,0,0);
  }
  if(reduceMotion){draw();return}
  function frame(){t+=0.011;draw();requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})();
</script>
